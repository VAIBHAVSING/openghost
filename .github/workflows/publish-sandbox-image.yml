name: Publish sandbox image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/publish-sandbox-image.yml"
      - "docker/**"
  pull_request:
    paths:
      - ".github/workflows/publish-sandbox-image.yml"
      - "docker/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sandbox-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish sandbox image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          if [[ -n "${GHCR_IMAGE}" ]]; then
            image="${GHCR_IMAGE}"
          else
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            image="ghcr.io/${owner}/openghost-sandbox"
          fi

          echo "image=${image,,}" >> "${GITHUB_OUTPUT}"
        env:
          GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=OpenGhost sandbox
            org.opencontainers.image.description=Developer sandbox image for the OpenGhost skill
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
